<footer id="footer">

    {{ partial "menu.html" . }}

    {{- with (or .Site.Data.site.social .Site.Params.social) }}
    <div class="social">
        {{ partial "social.html" . }}
    </div>
    {{- end }}
    <p style="color:grey;">{{ .Site.Data.site.copyright | default .Site.Params.main.copyright | safeHTML }}</p>
</footer>
